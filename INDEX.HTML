<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabral e Silva | Assessoria Financeira & Imobiliária</title>
    <style>
        :root {
            --bg-dark: #06121e; /* Azul escuro sofisticado baseado no logo */
            --bg-card: #0b1e32;
            --gold-primary: #d4af37; /* Dourado do logotipo */
            --gold-hover: #b8962e;
            --text-white: #ffffff;
            --text-gray: #a4b3c6;
            --success-green: #25d366;
            --border-color: #162e49;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            background: var(--bg-dark);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Logotipo Integrado */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-symbol {
            font-family: 'Georgia', serif;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--gold-primary);
            position: relative;
            line-height: 1;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .logo-subtitle {
            color: var(--gold-primary);
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-gray);
            margin-left: 2rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold-primary);
        }

        .nav-links a.btn-nav-whats {
            background-color: var(--gold-primary);
            color: #000000;
            padding: 0.6rem 1.4rem;
            border-radius: 4px;
            font-weight: 700;
            transition: background 0.3s, transform 0.2s;
        }

        .nav-links a.btn-nav-whats:hover {
            background-color: var(--gold-hover);
            transform: translateY(-1px);
        }

        /* Hero Section */
        .hero {
            position: relative;
            padding: 6rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4rem;
            background: radial-gradient(circle at 20% 30%, #0d2847 0%, var(--bg-dark) 70%);
        }

        /* Traçado das Casas Integrado com o Plano de Fundo Azul */
        .hero::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 1200 300' fill='none' stroke='%23162e49' stroke-width='1.5'%3E%3Cpath d='M0 300h1200M50 300V180l40-30 40 30v120M200 300V140l50-40 50 40v120h100V100l60-45 60 45v200M650 300V160l45-35 45 35v140M900 300V120l55-40 55 40v180'/%3E%3C/svg%3E");
            background-position: bottom;
            background-repeat: no-repeat;
            background-size: cover;
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
        }

        .hero-text {
            flex: 1.2;
            min-width: 300px;
            z-index: 2;
        }

        .hero-text h1 {
            font-size: 3.2rem;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            font-weight: 800;
        }

        .hero-text h1 span {
            color: var(--gold-primary);
        }

        .hero-text p {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            color: var(--text-gray);
            max-width: 600px;
        }

        /* Formulário de Simulação */
        .simulador-box {
            background: var(--bg-card);
            padding: 3rem 2.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 320px;
            max-width: 460px;
            z-index: 2;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .simulador-box h3 {
            margin-bottom: 0.5rem;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
        }

        .simulador-box .sub-whats {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gold-primary);
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.9rem 1rem;
            background: #040c14;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            color: var(--text-white);
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold-primary);
        }

        .btn-submit {
            width: 100%;
            padding: 1.1rem;
            background: var(--success-green);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background-color: #1ebe57;
            transform: translateY(-2px);
        }

        /* Seção Nossas Soluções */
        .solutions {
            padding: 6rem 5%;
            border-top: 1px solid var(--border-color);
            background: linear-gradient(180deg, var(--bg-dark) 0%, #040c14 100%);
        }

        .solutions h2 {
            font-size: 2.2rem;
            margin-bottom: 3rem;
            font-weight: 800;
            text-align: center;
        }

        .solutions h2 span {
            color: var(--gold-primary);
        }

        .grid-solutions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .sol-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: border-color 0.3s, transform 0.3s;
        }

        .sol-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-5px);
        }

        .sol-card h4 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            font-weight: 700;
            color: var(--text-white);
        }

        .sol-card p {
            color: var(--text-gray);
            font-size: 1rem;
        }

        /* Botão Flutuante */
        .whatsapp-floating {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: var(--success-green);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            transition: transform 0.3s;
        }

        .whatsapp-floating:hover {
            transform: scale(1.1);
        }

        .whatsapp-floating svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        /* Footer */
        footer {
            background: #02080e;
            padding: 4rem 5% 2rem;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-gray);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .footer-info h4 {
            font-size: 1.1rem;
            color: var(--text-white);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-info a {
            color: var(--text-gray);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-info a:hover {
            color: var(--gold-primary);
        }

        .copyright {
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.6;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }
